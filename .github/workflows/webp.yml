name: WebP versions of headshots and podcast covers
# conf42.com shows webp/<name>.webp / webp/sm/<name>.webp (70-99% smaller than the PNGs) and falls back
# to the PNG until these exist, so a fresh upload works right away and gets lighter a minute later.
on:
  push:
    branches: [main]
    paths: ['headshots/**.png', 'podcasts/**.png', 'make_webp.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: webp
  cancel-in-progress: false
jobs:
  webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      # PNGs changed by this push (replaced headshots included) are always re-encoded
      - name: Write WebP files
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=()
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            while IFS= read -r f; do changed+=("$f"); done < <(git -c core.quotepath=off diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'headshots/*.png' 'podcasts/*.png')
          fi
          python make_webp.py "${changed[@]}"
      - name: Commit new WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add headshots/webp podcasts/webp
          git diff --cached --quiet || (git commit -m "WebP versions of new headshots/podcast covers" && git push)
